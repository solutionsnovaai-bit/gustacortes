    <script>
      /* Decide a abertura antes do primeiro quadro: completa na 1ª visita, rápida ao voltar, nenhuma com "reduzir movimento". */
      (function () {
        var modo = 'completa'
        try { if (sessionStorage.getItem('gusta-abertura')) modo = 'rapida' } catch (e) {}
        try { if (matchMedia('(prefers-reduced-motion: reduce)').matches) modo = 'nenhuma' } catch (e) {}
        document.documentElement.setAttribute('data-abertura', modo)
      })()
    </script>
    <style>
      html,body{background:__COR_FUNDO__}
      .abertura-estatica{position:fixed;inset:0;z-index:100;background:#050506;animation:abertura-seguranca .6s ease 9s forwards}
      html[data-abertura="nenhuma"] .abertura-estatica{display:none}
      @keyframes abertura-seguranca{to{opacity:0;visibility:hidden}}
    </style>
  </head>
  <body>
    <div id="root"><div class="abertura-estatica" aria-hidden="true"></div></div>
